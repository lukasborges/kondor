name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container: fedora:latest

    steps:
      - name: Install dependencies
        run: |
          dnf -y install cmake ninja-build gcc-c++ make file wget git nodejs gh \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwebengine-devel qt6-qttools-devel qt6-qtwebchannel-devel \
            kf6-kirigami kf6-qqc2-desktop-style kf6-kwallet-devel hunspell-en-US hunspell-pt-BR fuse-libs \
            plasma-integration plasma-breeze-qt6 qt6-qtsvg

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Install into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Prepare AppDir
        run: |
          cp packaging/kondor.desktop AppDir/
          # Spell checking dictionaries installed by `cmake --install`
          test -f AppDir/usr/share/kondor/qtwebengine_dictionaries/en-US.bdic
          test -f AppDir/usr/share/kondor/qtwebengine_dictionaries/pt-BR.bdic

          cp packaging/kondor.png AppDir/

          # QtWebEngine (fallback; the Qt plugin usually copies it by itself)
          mkdir -p AppDir/usr/libexec
          cp /usr/lib64/qt6/libexec/QtWebEngineProcess AppDir/usr/libexec/ 2>/dev/null || true
          cp -r /usr/share/qt6/resources AppDir/usr/share/qt6/ 2>/dev/null || true
          cp -r /usr/share/qt6/translations AppDir/usr/share/qt6/ 2>/dev/null || true

          # KDE QQC2 style (set from C++, so the QML scanner does not pick it up)
          mkdir -p AppDir/usr/qml/org/kde AppDir/usr/plugins/platforms
          cp -r /usr/lib64/qt6/qml/org/kde/desktop AppDir/usr/qml/org/kde/
          cp -r /usr/lib64/qt6/qml/org/kde/qqc2desktopstyle AppDir/usr/qml/org/kde/

          # Wayland support
          cp /usr/lib64/qt6/plugins/platforms/libqwayland.so AppDir/usr/plugins/platforms/ 2>/dev/null || true
          cp -r /usr/lib64/qt6/plugins/wayland-* AppDir/usr/plugins/ 2>/dev/null || true

          # SQLite driver (history): the AppImage cannot see the system plugin.
          mkdir -p AppDir/usr/plugins/sqldrivers
          cp /usr/lib64/qt6/plugins/sqldrivers/libqsqlite.so AppDir/usr/plugins/sqldrivers/

          # Plasma integration. The AppImage's qt.conf only sees the plugins inside it,
          # so without these the app starts with the Fusion style and no icons:
          #  - KDE platform theme (the user's icon theme, colors and fonts)
          #  - Breeze style (org.kde.desktop draws the controls via QStyle)
          #  - Kirigami desktop platform and SVG icon engine
          for p in platformthemes/KDEPlasmaPlatformTheme6.so styles/breeze6.so \
                   kf6/kirigami/platform/org.kde.desktop.so iconengines/libqsvgicon.so; do
            mkdir -p "AppDir/usr/plugins/$(dirname "$p")"
            cp "/usr/lib64/qt6/plugins/$p" "AppDir/usr/plugins/$p"
          done

      - name: Download AppImage tools
        run: |
          wget -q -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy
          wget -q -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Create AppImage
        env:
          QML_SOURCES_PATHS: "${{ github.workspace }}/qml"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
          # linuxdeploy names the AppImage after the desktop Name ("Kondor Browser"),
          # so pin the file name to keep the release asset stable.
          LDAI_OUTPUT: Kondor-x86_64.AppImage
          OUTPUT: Kondor-x86_64.AppImage
        run: |
          export PATH="/usr/lib64/qt6/bin:$PATH"
          # --deploy-deps-only: brings the libraries (KF6 etc.) of the hand-copied plugins
          # libp11-kit stays the system one: NSS loads the system p11-kit-proxy.so (a symlink to
          # libp11-kit), and a second bundled copy crashes in its destructor when the app quits.
          ./linuxdeploy --appdir AppDir --plugin qt \
            --exclude-library "libp11-kit.so*" \
            --deploy-deps-only AppDir/usr/plugins/platformthemes \
            --deploy-deps-only AppDir/usr/plugins/styles \
            --deploy-deps-only AppDir/usr/plugins/kf6 \
            --deploy-deps-only AppDir/usr/plugins/iconengines \
            --deploy-deps-only AppDir/usr/plugins/sqldrivers
          # The Qt plugin deploys libp11-kit again despite --exclude-library: drop it, then package.
          rm -f AppDir/usr/lib/libp11-kit.so*
          ./linuxdeploy --appdir AppDir --exclude-library "libp11-kit.so*" --output appimage
          test ! -e AppDir/usr/lib/libp11-kit.so.0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" Kondor-*.AppImage \
            --title "Kondor Browser $GITHUB_REF_NAME" \
            --generate-notes

  flatpak:
    runs-on: ubuntu-24.04
    needs: release
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Kondor.flatpak
          manifest-path: packaging/flatpak/io.github.lukasborges.Kondor.yml
          cache-key: flatpak-builder-${{ github.sha }}

  flatpak-upload:
    runs-on: ubuntu-24.04
    needs: flatpak
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: Upload bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="$(find bundle -name Kondor.flatpak | head -n 1)"
          test -n "$file"
          gh release upload "$GITHUB_REF_NAME" "$file" --clobber --repo "$GITHUB_REPOSITORY"
