name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 has Qt 6.4 and the project requires 6.8+; we use Fedora (Qt 6.11).
    container: fedora:latest

    steps:
      - name: Install dependencies
        # Fedora mirrors sometimes stall: retry with a time limit instead of hanging the job for hours.
        timeout-minutes: 50
        run: |
          for attempt in 1 2 3; do
            timeout 15m dnf -y install cmake ninja-build gcc-c++ make git nodejs python3 \
                qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwebengine-devel qt6-qttools-devel qt6-qtwebchannel-devel \
                kf6-kirigami kf6-qqc2-desktop-style kf6-kwallet-devel kf6-karchive-devel hunspell-en-US hunspell-pt-BR && exit 0
            echo "::warning::dnf install failed or timed out (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Code quality
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/check-code-quality.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check translations
        run: |
          # The container job runs as root on a workspace owned by another user,
          # so git needs the checkout marked as safe before diffing it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake --build build --target update_translations
          if ! git diff --exit-code -- i18n/; then
            echo "::error::i18n/*.ts are stale; run update_translations and commit the result"
            exit 1
          fi
          python3 - <<'PY'
          import glob
          import re
          import sys
          import xml.etree.ElementTree as ET

          failed = False
          for path in sorted(glob.glob("i18n/*.ts")):
              tree = ET.parse(path)
              for context in tree.getroot():
                  context_name = context.findtext("name")
                  for message in context.findall("message"):
                      source = message.findtext("source") or ""
                      translation = message.find("translation")
                      if translation is None:
                          print(f"::error file={path}::{context_name}: missing translation for {source!r}")
                          failed = True
                          continue
                      forms = (translation.findall("numerusform")
                               if message.get("numerus") == "yes" else [translation])
                      texts = [(form.text or "").strip() for form in forms]
                      if translation.get("type") == "unfinished" or not texts or any(not text for text in texts):
                          print(f"::error file={path}::{context_name}: unfinished or empty translation for {source!r}")
                          failed = True
                          continue
                      expected = sorted(set(re.findall(r"%\d+|%n", source)))
                      actual = sorted(set(re.findall(r"%\d+|%n", " ".join(texts))))
                      if expected != actual:
                          print(f"::error file={path}::{context_name}: placeholders differ for {source!r}: expected {expected}, got {actual}")
                          failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kondor-linux
          path: build/kondor
          if-no-files-found: error
