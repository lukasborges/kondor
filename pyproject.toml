[project]
name = "kondor"
version = "0.14.0"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 100
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/build.py",
    "scripts/staging/**/*.py",
    "scripts/bench-adblock.py",
    "scripts/update-translations.py",
    "scripts/check-translations.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL"]
ignore = ["N802", "N815"]

[tool.mypy]
strict = true
mypy_path = "src"
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = "--no-qt-log"

[[tool.mypy.overrides]]
module = ["PySide6.*", "shiboken6.*", "jeepney", "jeepney.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kondor.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
