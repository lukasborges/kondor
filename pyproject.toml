[project]
name = "kondor"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 100
include = [
    "kondor/**/*.py",
    "pytests/**/*.py",
    "packaging/python-proof/**/*.py",
    "scripts/build.py",
    "scripts/staging/**/*.py",
    "scripts/check-qml-api.py",
    "scripts/qmlapi/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL"]
ignore = ["N802", "N815"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["pytests"]
qt_api = "pyside6"

[[tool.mypy.overrides]]
module = ["PySide6.*", "shiboken6.*"]
ignore_missing_imports = true
