name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 has Qt 6.4 and the project requires 6.5+; we use Fedora (Qt 6.11).
    container: fedora:latest

    steps:
      - name: Install dependencies
        run: |
          dnf -y install cmake ninja-build gcc-c++ make git nodejs \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwebengine-devel qt6-qttools-devel \
            kf6-kirigami kf6-qqc2-desktop-style

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Check translations
        run: |
          # The container job runs as root on a workspace owned by another user,
          # so git needs the checkout marked as safe before diffing it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake --build build --target update_translations
          if ! git diff --exit-code -- i18n/; then
            echo "::error::i18n/*.ts are stale; run update_translations and commit the result"
            exit 1
          fi
          python3 - <<'PY'
          import glob
          import re
          import sys
          import xml.etree.ElementTree as ET

          failed = False
          for path in sorted(glob.glob("i18n/*.ts")):
              tree = ET.parse(path)
              for context in tree.getroot():
                  context_name = context.findtext("name")
                  for message in context.findall("message"):
                      source = message.findtext("source") or ""
                      translation = message.find("translation")
                      if translation is None:
                          print(f"::error file={path}::{context_name}: missing translation for {source!r}")
                          failed = True
                          continue
                      forms = (translation.findall("numerusform")
                               if translation.get("numerus") == "yes" else [translation])
                      texts = [(form.text or "").strip() for form in forms]
                      if translation.get("type") == "unfinished" or not texts or any(not text for text in texts):
                          print(f"::error file={path}::{context_name}: unfinished or empty translation for {source!r}")
                          failed = True
                          continue
                      expected = sorted(re.findall(r"%\d+|%n", source))
                      actual = sorted(re.findall(r"%\d+|%n", " ".join(texts)))
                      if expected != actual:
                          print(f"::error file={path}::{context_name}: placeholders differ for {source!r}: expected {expected}, got {actual}")
                          failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kondor-linux
          path: build/kondor
          if-no-files-found: error
