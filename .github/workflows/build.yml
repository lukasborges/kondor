name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 has Qt 6.4 and the project requires 6.8+; we use Fedora (Qt 6.11).
    container: fedora:latest

    steps:
      - name: Install dependencies
        # Fedora mirrors sometimes stall: retry with a time limit instead of hanging the job for hours.
        timeout-minutes: 50
        run: |
          for attempt in 1 2 3; do
            timeout 15m dnf -y install git python3 python3-pyside6 python3-jeepney python3-langdetect pyside6-tools python3-pytest \
                python3-pytest-qt python3-mypy ruff kf6-kirigami kf6-qqc2-desktop-style qt6-qtdeclarative \
                dbus-daemon procps-ng xorg-x11-server-Xvfb && exit 0
            echo "::warning::dnf install failed or timed out (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Code quality
        timeout-minutes: 5
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/check-code-quality.py

      - name: Ruff
        timeout-minutes: 5
        run: ruff check

      - name: Mypy
        timeout-minutes: 10
        run: mypy --strict src/kondor

      - name: Stage the build
        timeout-minutes: 10
        run: python3 scripts/build.py

      - name: Pytest
        timeout-minutes: 20
        run: scripts/run-pytests.sh

      - name: Check translations
        timeout-minutes: 5
        run: |
          # The container job runs as root on a workspace owned by another user,
          # so git needs the checkout marked as safe before diffing it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/update-translations.py
          if ! git diff --exit-code -- i18n/; then
            echo "::error::i18n/*.ts are stale; run scripts/update-translations.py and commit the result"
            exit 1
          fi
          python3 scripts/check-translations.py
