app-id: io.github.lukasborges.KondorProof
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: kondor-proof
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
build-options:
  append-path: /usr/lib/sdk/llvm20/bin
  env:
    LLVM_INSTALL_DIR: /usr/lib/sdk/llvm20
    CLANG_INSTALL_DIR: /usr/lib/sdk/llvm20
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=PYTHONPATH=/app/lib/python3.13/site-packages
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: shiboken6-generator
    buildsystem: cmake-ninja
    subdir: sources/shiboken6_generator
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
      - -DPython_EXECUTABLE=/usr/bin/python3
    sources: &pyside-sources
      - type: archive
        url: https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.11.2-src/pyside-setup-everywhere-src-6.11.2.tar.xz
        sha256: cba47efbaad1bedd529725cbc14e21f156c7a19366f07b3edfbb076ffd7afdf8
  - name: shiboken6
    buildsystem: cmake-ninja
    subdir: sources/shiboken6
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
      - -DPython_EXECUTABLE=/usr/bin/python3
    sources: *pyside-sources
  - name: pyside6
    buildsystem: cmake-ninja
    subdir: sources/pyside6
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
      - -DPython_EXECUTABLE=/usr/bin/python3
      - -DMODULES=Core;Gui;Qml;Quick;QuickControls2;Network;Sql;DBus;WebEngineCore;WebEngineQuick;WebChannel
    sources: *pyside-sources
  - name: kondor-proof
    buildsystem: simple
    build-commands:
      - install -d /app/share/kondor-proof/qml/Kondor
      - install -m 644 *.py /app/share/kondor-proof/
      - install -m 644 qml/Kondor/* /app/share/kondor-proof/qml/Kondor/
      - |
        printf '#!/bin/sh\nexec python3 /app/share/kondor-proof/proof.py "$@"\n' > /app/bin/kondor-proof
        chmod +x /app/bin/kondor-proof
    sources:
      - type: dir
        path: .
