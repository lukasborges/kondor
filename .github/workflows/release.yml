name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        # Fedora mirrors sometimes stall: retry with a time limit instead of hanging the job for hours.
        timeout-minutes: 50
        run: |
          for attempt in 1 2 3; do
            timeout 15m dnf -y install git python3 python3-pyside6 python3-jeepney python3-langdetect pyside6-tools file wget gh fuse-libs \
                qt6-qtbase qt6-qtdeclarative qt6-qtwebengine qt6-qtwebchannel qt6-qtwebsockets qt6-qtsvg qt6-qtwayland \
                kf6-kirigami kf6-qqc2-desktop-style kf6-sonnet plasma-union kf6-kitemmodels plasma-integration plasma-breeze-qt6 \
                hunspell-en-US hunspell-pt-BR && exit 0
            echo "::warning::dnf install failed or timed out (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare AppDir
        run: |
          packaging/appimage/prepare-appdir.sh AppDir
          test -f AppDir/usr/share/kondor/qtwebengine_dictionaries/en-US.bdic
          test -f AppDir/usr/share/kondor/qtwebengine_dictionaries/pt-BR.bdic

      - name: Download AppImage tools
        run: |
          wget -q -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy
          chmod +x linuxdeploy

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
          # linuxdeploy names the AppImage after the desktop Name ("Kondor Browser"),
          # so pin the file name to keep the release asset stable.
          LDAI_OUTPUT: Kondor-x86_64.AppImage
          OUTPUT: Kondor-x86_64.AppImage
        run: |
          PYV="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          PLUGIN_ARGS="$(find AppDir/usr/plugins AppDir/usr/qml -name '*.so' -printf '--deploy-deps-only %p ')"
          # libp11-kit stays the system one: NSS loads the system p11-kit-proxy.so (a symlink to
          # libp11-kit), and a second bundled copy crashes in its destructor when the app quits.
          ./linuxdeploy --appdir AppDir \
            --exclude-library "libp11-kit.so*" \
            --deploy-deps-only "AppDir/usr/lib/python$PYV/site-packages/PySide6" \
            --deploy-deps-only "AppDir/usr/lib/python$PYV/lib-dynload" \
            --deploy-deps-only AppDir/usr/libexec \
            $PLUGIN_ARGS
          rm -f AppDir/usr/lib/libp11-kit.so*
          ./linuxdeploy --appdir AppDir --exclude-library "libp11-kit.so*" --output appimage
          test ! -e AppDir/usr/lib/libp11-kit.so.0

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Kondor-x86_64.AppImage
          path: Kondor-x86_64.AppImage
          if-no-files-found: error

  appimage-run:
    runs-on: ubuntu-24.04
    needs: appimage
    container: fedora:latest
    timeout-minutes: 20

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: Kondor-x86_64.AppImage

      - name: Install host libraries only
        run: |
          dnf -y install dbus-daemon alsa-lib expat fontconfig freetype fribidi gmp harfbuzz \
              libcom_err libdrm libglvnd libglvnd-egl libglvnd-glx libglvnd-opengl libgpg-error \
              libICE libSM libstdc++ libuuid libwayland-client libX11 libX11-xcb libxcb \
              mesa-libEGL mesa-libGL mesa-libgbm pipewire-libs zlib-ng-compat

      - name: Check that the bundle is self-contained
        run: "! rpm -q python3-pyside6 qt6-qtbase"

      - name: Start the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          chmod +x Kondor-x86_64.AppImage
          home="$(mktemp -d)"
          export XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" XDG_CACHE_HOME="$home/cache"
          status=0
          dbus-run-session -- timeout 15 ./Kondor-x86_64.AppImage about:blank > run.log 2>&1 || status=$?
          cat run.log
          test "$status" -eq 0 -o "$status" -eq 124
          ! grep -E 'ReferenceError|TypeError|Cannot assign|is not a type|cannot find the staged build|is not installed|unavailable|cannot load the browser window|No functional TLS backend' run.log

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: appimage-run
    container: fedora:latest

    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: dnf -y install git gh

      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: Kondor-x86_64.AppImage

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "::error::$notes is missing: write the release notes before tagging"; exit 1; }
          gh release create "$GITHUB_REF_NAME" Kondor-*.AppImage \
            --title "Kondor Browser $GITHUB_REF_NAME" \
            --notes-file "$notes"

  flatpak:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: release
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import the signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY is not set: see docs/specs/0098-flatpak-repository.md"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          test -n "$key_id"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Restore the published repository
        run: |
          ostree init --mode=archive-z2 --repo=repo
          status="$(curl -sS --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' --head https://lukasborges.github.io/kondor-browser/repo/summary)"
          case "$status" in
            200)
              ostree remote add --repo=repo --no-gpg-verify published https://lukasborges.github.io/kondor-browser/repo/
              # GitHub Pages answers 429 when releases mirror the repository often: wait and resume.
              for attempt in 1 2 3 4 5; do
                ostree pull --repo=repo --mirror published && break
                [ "$attempt" = 5 ] && exit 1
                echo "::warning::Mirroring the published repository failed (attempt $attempt), retrying in $((attempt * 60)) s"
                sleep $((attempt * 60))
              done
              ostree remote delete --repo=repo published
              ;;
            404)
              echo "::notice::Nothing is published yet: starting from an empty repository"
              ;;
            *)
              echo "::error::Unexpected HTTP status $status while checking the published repository"
              exit 1
              ;;
          esac

      - name: Move the Flatpak installation off the image layer
        # Updating a runtime that ships in the container image renames directories of the image's
        # overlayfs layer, which fails with "Invalid cross-device link" whenever Flathub has a
        # newer SDK than the image. A copy on the runner's disk can be updated.
        run: |
          cp -a /var/lib/flatpak "$RUNNER_TEMP/flatpak"
          echo "FLATPAK_SYSTEM_DIR=$RUNNER_TEMP/flatpak" >> "$GITHUB_ENV"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.lukasborges.Kondor.yml
          build-bundle: false
          upload-artifact: false
          branch: stable
          gpg-sign: ${{ env.FLATPAK_KEY_ID }}
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Update the repository and build the site
        run: scripts/flatpak-site.sh "$FLATPAK_KEY_ID" repo site

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: Kondor.flatpak

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: flatpak
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  flatpak-upload:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: flatpak
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle

      - name: Upload bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="$(find bundle -name Kondor.flatpak | head -n 1)"
          test -n "$file"
          gh release upload "$GITHUB_REF_NAME" "$file" --clobber --repo "$GITHUB_REPOSITORY"
